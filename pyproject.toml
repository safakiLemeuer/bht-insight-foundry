[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bht-insight-foundry"
version = "0.1.0"
description = "Secure enterprise knowledge assistant built with Azure AI Foundry."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Bluebery Hawaii Technology Solutions LLC" }
]
dependencies = [
  "azure-identity>=1.19.0,<2.0.0",
  "azure-search-documents>=11.6.0,<12.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "openai>=1.60.0,<2.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8.0,<2.0.0",
  "black>=24.10.0,<26.0.0",
  "pip-audit>=2.7.0,<3.0.0",
  "pre-commit>=4.0.0,<5.0.0",
  "pyright>=1.1.390,<2.0.0",
  "pytest>=8.3.0,<10.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
  "httpx>=0.28.0,<1.0.0",
  "ruff>=0.9.0,<1.0.0"
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
